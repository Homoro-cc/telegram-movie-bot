<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Ad Loop</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 320px; }
  h1 { color: #0088cc; font-size: 20px; }
  button { background: #0088cc; color: #fff; border: none; border-radius: 6px; padding: 12px 18px; font-size: 16px; cursor: pointer; margin-top: 15px; width: 100%; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { margin-top: 10px; color: #666; font-size: 14px; }
  .countdown { font-weight: bold; color: #0088cc; }
</style>
</head>
<body>
<div class="box">
  <h1>Auto Ad Loop</h1>
  <p>Button will show ad every 5 seconds automatically.</p>
  <button id="actionBtn">Show Ad</button>
  <div id="status">Ready</div>
  <div class="auto-info">
    <p>Ad will auto-show in <span id="countdown" class="countdown">5</span> seconds</p>
  </div>
</div>

<!-- Monetag Rewarded Interstitial SDK -->
<script src="//libtl.com/sdk.js" data-zone="10168919" data-sdk="show_10168919"></script>

<script>
const btn = document.getElementById("actionBtn");
const status = document.getElementById("status");
const countdownEl = document.getElementById("countdown");

let countdownValue = 5;
let autoClickTimer = null;

function updateUI() {
  btn.textContent = "Show Ad";
  status.textContent = "Next: Watch ad.";
}

function startAutoClickTimer() {
  if (autoClickTimer) clearInterval(autoClickTimer);
  countdownValue = 5;
  countdownEl.textContent = countdownValue;

  autoClickTimer = setInterval(() => {
    countdownValue--;
    countdownEl.textContent = countdownValue;

    if (countdownValue <= 0) {
      clearInterval(autoClickTimer);
      handleClick();
    }
  }, 1000);
}

// Automatically click "Continue" or "Close" buttons on ad
function autoClickAdButtons() {
  const maxAttempts = 20; // try 20 times (~20s)
  let attempts = 0;

  const interval = setInterval(() => {
    attempts++;
    // Try to find Continue button (you may need to adjust the selector)
    const continueBtn = document.querySelector(".monetag-continue, .monetag-btn-continue");
    const closeBtn = document.querySelector(".monetag-close, .monetag-btn-close");

    if (continueBtn) {
      continueBtn.click();
      clearInterval(interval);
      status.textContent = "Ad finished (Continue clicked).";
      startAutoClickTimer();
    } else if (closeBtn) {
      closeBtn.click();
      clearInterval(interval);
      status.textContent = "Ad finished (Close clicked).";
      startAutoClickTimer();
    } else if (attempts >= maxAttempts) {
      clearInterval(interval);
      status.textContent = "Ad finished (No button found).";
      startAutoClickTimer();
    }
  }, 1000);
}

async function handleClick() {
  btn.disabled = true;
  status.textContent = "Loading ad...";

  try {
    await show_10168919(); // show ad
    status.textContent = "Ad playing... waiting to auto-click button.";
    // Start auto-clicking Continue/Close buttons after ad starts
    autoClickAdButtons();
  } catch (err) {
    console.error("Ad error:", err);
    status.textContent = "Ad failed. Retrying...";
    btn.disabled = false;
    startAutoClickTimer();
  }
}

btn.addEventListener("click", handleClick);
updateUI();
startAutoClickTimer();
</script>
</body>
</html>
