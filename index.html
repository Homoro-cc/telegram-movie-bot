<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ad then Google</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 320px;
    }
    h1 {
      color: #0088cc;
    }
    button {
      background: #0088cc;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background: #0077b5;
    }
    #status {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Open Google</h1>
    <p>First time you'll see an ad, then go to Google next time.</p>
    <button id="openBtn">Open Google</button>
    <div id="status">Ready</div>
  </div>

  <!-- ✅ Monetag Rewarded Interstitial SDK -->
  <script src="//libtl.com/sdk.js" data-zone="10168919" data-sdk="show_10168919"></script>

  <!-- ✅ Telegram SDK (optional, if opened in Telegram) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script>
    const btn = document.getElementById("openBtn");
    const status = document.getElementById("status");
    const GOOGLE_URL = "https://google.com";
    const FLAG = "ad_watched_once";
    const tg = window.Telegram?.WebApp;

    function updateUI() {
      if (localStorage.getItem(FLAG)) {
        btn.textContent = "Go to Google";
        status.textContent = "Ad watched — click to go to Google.";
      } else {
        btn.textContent = "Show Ad";
        status.textContent = "Click to watch ad first.";
      }
    }

    async function handleClick() {
      const watched = localStorage.getItem(FLAG);
      if (!watched) {
        status.textContent = "Loading ad...";
        try {
          // Show rewarded ad
          await show_10168919();
          alert("You have seen an ad!");
          localStorage.setItem(FLAG, "1");
          updateUI();
        } catch (err) {
          console.error("Ad error:", err);
          alert("Ad failed or skipped.");
        }
      } else {
        status.textContent = "Opening Google...";
        // open Google in external browser or Telegram web app
        if (tg && typeof tg.openLink === "function") {
          tg.openLink(GOOGLE_URL);
        } else {
          window.open(GOOGLE_URL, "_blank");
        }
      }
    }

    btn.addEventListener("click", handleClick);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") updateUI();
    });

    updateUI();
  </script>
</body>
</html>
