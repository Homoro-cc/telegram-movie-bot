<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Ad Loop</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .box {
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    text-align: center;
    width: 320px;
  }
  h1 { color: #0088cc; font-size: 20px; }
  button {
    background: #0088cc;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px 18px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
    width: 100%;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { margin-top: 10px; color: #666; font-size: 14px; }
  .countdown { font-weight: bold; color: #0088cc; }
</style>
</head>
<body>
<div class="box">
  <h1>Auto Ad Loop [v1.3] </h1>
  <p>Button will show ad every 5 seconds automatically.</p>
  <button id="actionBtn">Show Ad</button>
  <div id="status">Ready</div>
  <div class="auto-info">
    <p>Ad will auto-show in <span id="countdown" class="countdown">5</span> seconds</p>
  </div>
</div>

<!-- Monetag Rewarded Interstitial SDK -->
<script src="//libtl.com/sdk.js" data-zone="10168919" data-sdk="show_10168919"></script>

<script>
const btn = document.getElementById("actionBtn");
const status = document.getElementById("status");
const countdownEl = document.getElementById("countdown");

let countdownValue = 5;
let autoClickTimer = null;

// Update button UI
function updateUI() {
  btn.textContent = "Show Ad";
  status.textContent = "Next: Watch ad.";
}

// Start auto-click timer
function startAutoClickTimer() {
  if (autoClickTimer) clearInterval(autoClickTimer);
  countdownValue = 5;
  countdownEl.textContent = countdownValue;

  autoClickTimer = setInterval(() => {
    countdownValue--;
    countdownEl.textContent = countdownValue;

    if (countdownValue <= 0) {
      clearInterval(autoClickTimer);
      handleClick();
    }
  }, 1000);
}

// Handle ad click
async function handleClick() {
  btn.disabled = true;
  status.textContent = "Loading ad...";

  try {
    await show_10168919(); // show ad
    // automatically click "continue" if SDK allows it
    // Monetag SDK automatically shows continue dialog, so we just wait
    status.textContent = "Ad finished. Preparing next ad...";
  } catch (err) {
    console.error("Ad error:", err);
    status.textContent = "Ad failed. Retrying...";
  } finally {
    btn.disabled = false;
    updateUI();
    startAutoClickTimer(); // restart timer for next ad
  }
}

// Trigger ad if button is clicked manually
btn.addEventListener("click", handleClick);
updateUI();
startAutoClickTimer();
</script>
</body>
</html>
